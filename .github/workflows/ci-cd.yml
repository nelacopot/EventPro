name: EventPro CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  test:
    name: Test Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with coverage
        id: frontend-tests
        continue-on-error: true
        working-directory: frontend
        run: npm run test:coverage

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend with coverage
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventpro-coverage
          path: |
            frontend/coverage/
            backend/coverage/
          if-no-files-found: warn

      - name: Fail if any tests failed
        if: always()
        env:
          FRONTEND_TEST_OUTCOME: ${{ steps.frontend-tests.outcome }}
          BACKEND_TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
        run: |
          if [[ "$FRONTEND_TEST_OUTCOME" != "success" || "$BACKEND_TEST_OUTCOME" != "success" ]]; then
            echo "Frontend or backend tests failed."
            exit 1
          fi

  build:
    name: Build Frontend and Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventpro
      VITE_API_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Prepare backend runtime package
        run: |
          npm prune --omit=dev --prefix backend
          mkdir -p deploy/backend
          cp -a backend/dist deploy/backend/dist
          cp backend/package.json backend/package-lock.json deploy/backend/
          cp -a backend/node_modules deploy/backend/node_modules
          cp -a frontend/dist deploy/backend/public

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eventpro-build
          path: deploy/backend/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Validate deployment settings
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || { echo "Set production environment variable AZURE_WEBAPP_NAME."; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "Set production environment secret AZURE_WEBAPP_PUBLISH_PROFILE."; exit 1; }

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: eventpro-build
          path: artifacts

      - name: Deploy frontend and backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifacts

      - name: Check deployed application
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          curl --fail --retry 10 --retry-delay 10 "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/"
          curl --fail "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api/health"
