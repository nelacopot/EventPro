name: EventPro CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  test:
    name: Test Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with coverage
        id: frontend-tests
        continue-on-error: true
        working-directory: frontend
        run: npm run test:coverage

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend with coverage
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventpro-coverage
          path: |
            frontend/coverage/
            backend/coverage/
          if-no-files-found: warn

      - name: Fail if any tests failed
        if: always()
        env:
          FRONTEND_TEST_OUTCOME: ${{ steps.frontend-tests.outcome }}
          BACKEND_TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
        run: |
          if [[ "$FRONTEND_TEST_OUTCOME" != "success" || "$BACKEND_TEST_OUTCOME" != "success" ]]; then
            echo "Frontend or backend tests failed."
            exit 1
          fi

  build:
    name: Build Frontend and Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventpro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eventpro-build
          path: |
            frontend/dist/
            backend/dist/
          if-no-files-found: error
